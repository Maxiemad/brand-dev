<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>GoToRetreats - Plan Your Retreat With Clarity, Confidence, and Zero Overwhelm</title>
    <meta name="description" content="Whether you're doing it yourself, need expert support, or want us to handle it all — we've got a path designed for you." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      * {
        cursor: none !important;
      }
      /* iOS Safari compatibility */
      @supports (-webkit-touch-callout: none) {
        * {
          cursor: auto !important;
        }
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Tidio Chat Widget Fixed Position for iOS and all devices */
      #tidio-chat,
      #tidio-chat-code,
      .tidio-chat,
      [id*="tidio"] {
        position: fixed !important;
        bottom: 20px !important;
        right: 20px !important;
        z-index: 9999 !important;
        transform: none !important;
        -webkit-transform: none !important;
        -moz-transform: none !important;
        -ms-transform: none !important;
        -o-transform: none !important;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
      
      /* iOS Safari specific fixes */
      @supports (-webkit-touch-callout: none) {
        #tidio-chat,
        #tidio-chat-code,
        .tidio-chat,
        [id*="tidio"] {
          position: fixed !important;
          bottom: 20px !important;
          right: 20px !important;
          z-index: 9999 !important;
          transform: none !important;
          -webkit-transform: none !important;
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
        }
      }
      
      /* Mobile specific fixes */
      @media (max-width: 768px) {
        #tidio-chat,
        #tidio-chat-code,
        .tidio-chat,
        [id*="tidio"] {
          position: fixed !important;
          bottom: 15px !important;
          right: 15px !important;
          z-index: 9999 !important;
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
        }
      }
      
      /* iOS Mobile specific fixes */
      @supports (-webkit-touch-callout: none) and (max-width: 768px) {
        #tidio-chat,
        #tidio-chat-code,
        .tidio-chat,
        [id*="tidio"] {
          position: fixed !important;
          bottom: 15px !important;
          right: 15px !important;
          z-index: 9999 !important;
          transform: none !important;
          -webkit-transform: none !important;
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Tidio Chat Widget -->
    <script src="//code.tidio.co/p2dbjrjg4sjg4n5iu1dyf1jlf5npxupq.js" async></script>
    <script>
      // Ensure Tidio is ready, then enforce fixed positioning (iOS-safe)
      (function ensureTidioReady() {
        function onReady(cb) {
          if (window.tidioChatApi && typeof window.tidioChatApi.on === 'function') {
            window.tidioChatApi.on('ready', cb);
          } else {
            document.addEventListener('tidioChat-ready', cb, { once: true });
          }
        }
        function applyStyles() {
          var selectors = ['#tidio-chat', '#tidio-chat-code', '.tidio-chat', '[id*="tidio"]'];
          selectors.forEach(function(sel) {
            document.querySelectorAll(sel).forEach(function(el) {
              el.style.setProperty('position', 'fixed', 'important');
              el.style.setProperty('bottom', '15px', 'important');
              el.style.setProperty('right', '15px', 'important');
              el.style.setProperty('z-index', '999999', 'important');
              el.style.setProperty('transform', 'none', 'important');
              el.style.setProperty('-webkit-transform', 'none', 'important');
              el.style.setProperty('display', 'block', 'important');
              el.style.setProperty('visibility', 'visible', 'important');
              el.style.setProperty('opacity', '1', 'important');
            });
          });
        }
        onReady(function() {
          applyStyles();
          // Re-apply on scroll/resize/orientation
          ['scroll', 'resize', 'orientationchange'].forEach(function(evt) {
            window.addEventListener(evt, function() { setTimeout(applyStyles, 50); }, { passive: true });
          });
          // Observe DOM changes
          var observer = new MutationObserver(function() { setTimeout(applyStyles, 50); });
          observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
          // Periodic reinforcement (iOS quirks)
          setInterval(applyStyles, 1500);
        });
      })();
    </script>
  </body>
</html>
