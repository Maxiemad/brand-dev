      body {

      /* Fix Tidio chat bot positioning on iOS mobile devices */
      #tidio-chat-code {
        position: fixed !important;
        bottom: 0 !important;
        right: 0 !important;
        z-index: 999999 !important;
        width: auto !important;
        height: auto !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        transform: none !important;
        transition: none !important;
      }

      @supports (-webkit-touch-callout: none) {

          bottom: env(safe-area-inset-bottom, 0) !important;
          right: env(safe-area-inset-right, 0) !important;
          z-index: 999999 !important;
          transform: translateZ(0) !important;
          -webkit-transform: translateZ(0) !important;
          -webkit-backface-visibility: hidden !important;
          backface-visibility: hidden !important;
        }
        
        /* Ensure Tidio iframe stays fixed */
        #tidio-chat-code iframe {
          position: fixed !important;
          bottom: env(safe-area-inset-bottom, 0) !important;
          right: env(safe-area-inset-right, 0) !important;
          z-index: 999999 !important;
          transform: translateZ(0) !important;
          -webkit-transform: translateZ(0) !important;
          -webkit-backface-visibility: hidden !important;
          backface-visibility: hidden !important;
        }
      }
      
      /* Additional iOS fixes for viewport issues */
      @media screen and (max-width: 768px) {
        #tidio-chat-code {
          position: fixed !important;
          bottom: 0 !important;
          right: 0 !important;
          z-index: 999999 !important;
          transform: translateZ(0) !important;
          -webkit-transform: translateZ(0) !important;

    <script>
      // Fix Tidio chat bot positioning on iOS mobile devices
      document.addEventListener('DOMContentLoaded', function() {
        // Function to ensure Tidio stays fixed
        function fixTidioPosition() {
          const tidioElement = document.getElementById('tidio-chat-code');
          if (tidioElement) {
            tidioElement.style.position = 'fixed';
            tidioElement.style.bottom = '0';
            tidioElement.style.right = '0';
            tidioElement.style.zIndex = '999999';
            tidioElement.style.transform = 'translateZ(0)';
            tidioElement.style.webkitTransform = 'translateZ(0)';
            
            // iOS Safari specific fixes
            if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
              tidioElement.style.bottom = 'env(safe-area-inset-bottom, 0)';
              tidioElement.style.right = 'env(safe-area-inset-right, 0)';
              tidioElement.style.webkitBackfaceVisibility = 'hidden';
              tidioElement.style.backfaceVisibility = 'hidden';
            }
          }
        }
        
        // Apply fixes immediately
        fixTidioPosition();
        
        // Apply fixes after a short delay to ensure Tidio is loaded
        setTimeout(fixTidioPosition, 1000);
        setTimeout(fixTidioPosition, 2000);
        setTimeout(fixTidioPosition, 3000);
        
        // Apply fixes on scroll to ensure it stays fixed
        window.addEventListener('scroll', fixTidioPosition, { passive: true });
        window.addEventListener('resize', fixTidioPosition, { passive: true });
        
        // Apply fixes on orientation change
        window.addEventListener('orientationchange', function() {
          setTimeout(fixTidioPosition, 100);
          setTimeout(fixTidioPosition, 500);
        });
        
        // Monitor for Tidio iframe creation and fix it too
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type === 'childList') {
              mutation.addedNodes.forEach(function(node) {
                if (node.nodeType === 1 && node.id === 'tidio-chat-code') {
                  fixTidioPosition();
                }
              });
            }
          });
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      });
    </script>
